plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.sklight.sklink'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.sklight.sklink'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '0.1'
    }

    // Khoa ky lay tu GitHub Secrets (workflow giai ma ra file va truyen mat khau qua bien moi truong).
    signingConfigs {
        fixed {
            storeFile file(System.getenv('SKLINK_KEYSTORE') ?: '../sklink.keystore')
            storePassword System.getenv('SKLINK_PASS')
            keyAlias 'sklink'
            keyPassword System.getenv('SKLINK_PASS')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
