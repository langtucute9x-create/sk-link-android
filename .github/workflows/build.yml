name: Build APK
on:
  push:
    branches: [sk-light]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Khoa ky (neu co)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sklink.keystore"; echo "SKL_KEYSTORE=$RUNNER_TEMP/sklink.keystore" >> $GITHUB_ENV; echo "SKL_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV; else echo "Khong co khoa -> dung khoa debug"; fi
      - name: Build
        run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk sk-light.apk
      - uses: actions/upload-artifact@v4
        with: { name: sk-light-apk, path: sk-light.apk }
      - name: Tao version.json cho tinh nang bao cap nhat
        run: |
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          export CODE NAME
          export SHA=$(sha256sum sk-light.apk | cut -d' ' -f1)
          export SIZE=$(stat -c%s sk-light.apk)
          export NOTES=$(git log -1 --pretty=%s | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+: *//')
          python3 -c "import json,os; json.dump({'versionCode':int(os.environ['CODE']),'versionName':os.environ['NAME'],'notes':os.environ['NOTES'],'sha256':os.environ['SHA'],'size':int(os.environ['SIZE']),'url':'https://github.com/${{ github.repository }}/releases/download/sk-light-latest/sk-light.apk'}, open('version.json','w'), ensure_ascii=False)"
          cat version.json
      - name: Phat hanh ban latest
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete sk-light-latest --yes --cleanup-tag || true
          gh release create sk-light-latest sk-light.apk version.json --target "$GITHUB_SHA" --prerelease --title "SK Light (ban moi nhat)" --notes "Build tu commit ${GITHUB_SHA::7}"
