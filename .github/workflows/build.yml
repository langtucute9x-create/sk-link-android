name: Build SK Auto
on:
  push:
    branches: [sk-auto]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Khoa ky (neu co)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sklink.keystore"; echo "SKL_KEYSTORE=$RUNNER_TEMP/sklink.keystore" >> $GITHUB_ENV; echo "SKL_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV; else echo "Khong co khoa -> dung khoa debug"; fi
      - name: Build
        run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk sk-auto.apk
      - uses: actions/upload-artifact@v4
        with: { name: sk-auto-apk, path: sk-auto.apk }
      - name: Phat hanh ban latest
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete sk-auto-latest --yes --cleanup-tag || true
          gh release create sk-auto-latest sk-auto.apk --target "$GITHUB_SHA" --prerelease --title "SK Auto (ban moi nhat)" --notes "Build tu commit ${GITHUB_SHA::7}"
