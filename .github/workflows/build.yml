name: Build APK
on:
  push:
    branches: [sk-driver, 'claude/sk-driver-**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Tai mo hinh nhan dien (EfficientDet-Lite0, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets
          curl -fL --retry 3 -o app/src/main/assets/det.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0.tflite
          ls -la app/src/main/assets/det.tflite
          test $(stat -c%s app/src/main/assets/det.tflite) -gt 1000000
      - name: Khoa ky (neu co)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sklink.keystore"; echo "SKL_KEYSTORE=$RUNNER_TEMP/sklink.keystore" >> $GITHUB_ENV; echo "SKL_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV; else echo "Khong co khoa -> dung khoa debug"; fi
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Dat ten APK va ghi file phien ban (app dung de kiem tra cap nhat)
        run: |
          cp app/build/outputs/apk/release/app-release.apk sk-driver.apk
          VC=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "$VC|$VN" > sk-driver-version.txt
          cat sk-driver-version.txt
          echo "VN=$VN" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with: { name: sk-driver-apk, path: sk-driver.apk }
      - name: Phat hanh ban latest
        if: github.ref == 'refs/heads/sk-driver'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete sk-driver-latest --yes --cleanup-tag || true
          gh release create sk-driver-latest sk-driver.apk sk-driver-version.txt --target "$GITHUB_SHA" --prerelease --title "SK Driver $VN (ban thu moi nhat)" --notes "Build tu commit ${GITHUB_SHA::7}"
