name: Build Play AAB
on:
  push:
    branches: [sk-light-play]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Khoa upload (neu co)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sklink.keystore"; echo "SKL_KEYSTORE=$RUNNER_TEMP/sklink.keystore" >> $GITHUB_ENV; echo "SKL_PASS=${{ secrets.KEYSTORE_PASS }}" >> $GITHUB_ENV; else echo "Khong co khoa -> dung khoa debug"; fi
      - name: Build AAB
        run: gradle --no-daemon bundlePlayRelease
      - name: Build APK ban play de thu
        run: gradle --no-daemon assemblePlayRelease
      - name: Kiem tra manifest ban play
        run: |
          sudo apt-get -qq install -y aapt >/dev/null 2>&1 || true
          APK=$(ls app/build/outputs/apk/play/release/*.apk | head -1)
          { aapt dump badging "$APK" | grep -E "package:|targetSdk|uses-permission|sdkVersion"; echo "ScreenReader=$(aapt dump xmltree "$APK" AndroidManifest.xml | grep -c ScreenReader)"; echo "update-provider=$(aapt dump xmltree "$APK" AndroidManifest.xml | grep -c '.update')"; } > manifest-report.txt || true
          cat manifest-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sk-light-play
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/play/release/*.apk
      - name: Phat hanh ban play (de tai ve kiem tra)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/bundle/playRelease/*.aab sk-light-play.aab
          cp app/build/outputs/apk/play/release/*.apk sk-light-play.apk
          gh release delete sk-light-play-latest --yes --cleanup-tag || true
          gh release create sk-light-play-latest sk-light-play.aab sk-light-play.apk manifest-report.txt --target "$GITHUB_SHA" --prerelease --title "SK Light ban CH Play (thu)" --notes "Build tu commit ${GITHUB_SHA::7}"
